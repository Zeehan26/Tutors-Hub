<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tutors Hub Prototype</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Hind+Siliguri:wght@400;500;600;700&display=swap">
<style>
/* Layout: a bright mint campus — floating glass pill nav, photo-led hero with an offset green block, rounded white cards with green-tinted depth, and deep-forest "night" bands for trust and money moments. Single light theme by design (matches the Tutors Hub and ZNF Math references); dark bands are part of the light look. */
:root{
  color-scheme:light;
  --bg:#f6fbf8; --surface:#ffffff; --mint:#e9faf3; --mint-2:#d4f4e5; --sunk:#f0f7f3; --glass:rgba(255,255,255,.82);
  --ink:#0d261d; --ink-2:#264638; --muted:#5b6f66; --faint:#8aa197; --line:#dcebe5; --line-2:#bfe5d2;
  --green:#19a972; --green-d:#0d8356; --green-dd:#0a5f40; --lime:#80d941; --olive:#2d5327; --glow:#34d399; --glow-2:#4ade80;
  --night:#0a1f18; --night-2:#12382a; --night-3:#05130e; --on-night:#eaf6f0; --night-muted:#93b1a6; --night-line:rgba(255,255,255,.1); --night-glass:rgba(255,255,255,.055);
  --amber:#f59e0b; --amber-soft:#fff4d8; --amber-ink:#8a5807;
  --good:#0f7d55; --good-soft:#e1f7ec; --warn:#94600a; --warn-soft:#fff1d2; --bad:#c03a32; --bad-soft:#fde7e4; --info:#2457d6; --info-soft:#e6eeff;
  --g-green:linear-gradient(135deg,#1fbf82,#0d8356); --g-cta:linear-gradient(135deg,#19a972 0%,#14b8a6 100%);
  --g-amber:linear-gradient(135deg,#fbbf24,#f97316); --g-sky:linear-gradient(135deg,#38bdf8,#6366f1); --g-rose:linear-gradient(135deg,#fb7185,#e11d48);
  --g-teal:linear-gradient(135deg,#2dd4bf,#0d9488); --g-lime:linear-gradient(135deg,#a3e635,#16a34a); --g-violet:linear-gradient(135deg,#a78bfa,#c026d3);
  --g-text:linear-gradient(90deg,#19a972,#0d8356 55%,#2d5327);
  --sh-s:0 6px 22px rgba(17,82,58,.06); --sh:0 18px 50px rgba(17,82,58,.10); --sh-l:0 30px 80px rgba(17,82,58,.18); --sh-glow:0 12px 28px rgba(25,169,114,.32);
  --r-s:12px; --r:18px; --r-l:24px; --r-xl:32px;
  --f:"Manrope","Segoe UI",system-ui,-apple-system,sans-serif;
  --f-bn:"Hind Siliguri","Noto Sans Bengali","Manrope",system-ui,sans-serif;
  --wrap:1180px;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
html{scroll-behavior:smooth}
body{font-family:var(--f);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--bg)}
h1,h2,h3,h4{font-family:var(--f);font-weight:800;line-height:1.06;margin:0;text-wrap:balance;letter-spacing:-.035em;color:var(--ink)}
h1{font-size:clamp(2.35rem,5.4vw + .6rem,4.4rem);letter-spacing:-.055em;line-height:1.02}
h2{font-size:clamp(1.85rem,2.6vw + 1rem,3rem);letter-spacing:-.045em}
h3{font-size:1.18rem;letter-spacing:-.02em;line-height:1.2}
h4{font-size:1rem;letter-spacing:-.01em}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--green-d)}
img{display:block;max-width:100%}
:focus-visible{outline:3px solid rgba(25,169,114,.55);outline-offset:2px;border-radius:10px}
.wrap{max-width:var(--wrap);margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.grad{background:var(--g-text);-webkit-background-clip:text;background-clip:text;color:transparent}
.bn{font-family:var(--f-bn);font-weight:500;color:var(--muted)}
.muted{color:var(--muted)} .faint{color:var(--faint)} .mono{font-variant-numeric:tabular-nums;font-weight:700;letter-spacing:.01em} .tnum{font-variant-numeric:tabular-nums}
.lede{font-size:1.1rem;color:var(--muted);max-width:60ch;line-height:1.75}
.stack{display:flex;flex-direction:column;gap:var(--g,12px)}
.row{display:flex;align-items:center;gap:var(--g,12px);flex-wrap:wrap}
.between{justify-content:space-between}
.center{text-align:center;align-items:center;margin-inline:auto}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic.sm{width:16px;height:16px}.ic.lg{width:26px;height:26px}
.tbd{background:var(--amber-soft);border:1px dashed #e0a43a;border-radius:6px;padding:0 6px;font-size:.8em;font-weight:700;color:var(--amber-ink);white-space:nowrap}

/* eyebrow pill with optional live dot */
.eyebrow{display:inline-flex;align-items:center;gap:8px;width:fit-content;padding:7px 13px;border-radius:999px;background:rgba(255,255,255,.8);border:1px solid #cdeedf;color:var(--green-d);font-size:.72rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;line-height:1.2;box-shadow:0 2px 8px rgba(17,82,58,.04)}
.eyebrow.plain{background:none;border:0;box-shadow:none;padding:0}
.live{position:relative;width:9px;height:9px;flex:none}
.live::before,.live::after{content:"";position:absolute;inset:0;border-radius:50%;background:var(--green)}
.live::before{animation:ping 1.8s cubic-bezier(0,0,.2,1) infinite;opacity:.6}
@keyframes ping{75%,100%{transform:scale(2.4);opacity:0}}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid transparent;border-radius:999px;padding:12px 22px;font-weight:700;font-size:.97rem;line-height:1.1;text-decoration:none;white-space:nowrap;transition:transform .18s ease,box-shadow .18s ease,background .18s ease,color .18s ease,border-color .18s ease}
.btn:hover{transform:translateY(-2px)}
.btn:active{transform:translateY(0)}
.btn-hi{background:var(--g-cta);color:#fff;box-shadow:var(--sh-glow)}
.btn-hi:hover{box-shadow:0 16px 34px rgba(25,169,114,.42)}
.btn-brand{background:var(--ink);color:#fff;box-shadow:0 8px 20px rgba(13,38,29,.18)}
.btn-brand:hover{background:var(--green-dd)}
.btn-ghost{background:#fff;border-color:var(--line);color:var(--ink)}
.btn-ghost:hover{border-color:var(--line-2);background:var(--mint);color:var(--green-dd)}
.btn-quiet{background:transparent;color:var(--green-d);padding-inline:8px}
.btn-quiet:hover{background:var(--mint);transform:none}
.btn-sm{padding:9px 15px;font-size:.86rem}
.btn-lg{padding:15px 26px;font-size:1.02rem}
.btn[disabled]{opacity:.55;cursor:default}
.icon-btn{display:inline-grid;place-items:center;width:42px;height:42px;border-radius:14px;border:1px solid var(--line);background:#fff;color:var(--ink);transition:background .18s,transform .18s}
.icon-btn:hover{background:var(--mint);transform:translateY(-1px)}

/* chips, pills, tiers */
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;background:var(--sunk);font-size:.8rem;font-weight:700;color:#3f5a4f;border:1px solid transparent;line-height:1.3}
button.chip{border-color:var(--line);background:#fff;transition:all .15s}
button.chip:hover{border-color:var(--line-2);background:var(--mint)}
button.chip[aria-pressed="true"]{background:var(--green);color:#fff;border-color:var(--green);box-shadow:0 6px 16px rgba(25,169,114,.25)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 11px 4px 9px;border-radius:999px;font-size:.76rem;font-weight:800;white-space:nowrap;line-height:1.35}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.p-good{background:var(--good-soft);color:var(--good)} .p-warn{background:var(--warn-soft);color:var(--warn)} .p-bad{background:var(--bad-soft);color:var(--bad)} .p-info{background:var(--info-soft);color:var(--info)} .p-mute{background:var(--sunk);color:var(--muted)}
.tier{display:inline-flex;align-items:center;font-size:.66rem;font-weight:800;letter-spacing:.1em;padding:3px 8px;border-radius:7px;background:var(--mint);color:var(--green-dd);line-height:1.3}
.tier-PLUS{background:var(--info-soft);color:var(--info)}
.tier-PRO{background:linear-gradient(135deg,#0d261d,#12382a);color:#fcd34d}

/* avatars */
.av{--h:160;display:inline-grid;place-items:center;flex:none;width:var(--s,48px);height:var(--s,48px);border-radius:50%;background:linear-gradient(135deg,hsl(var(--h) 72% 62%),hsl(calc(var(--h) + 38) 68% 42%));color:#fff;font-weight:800;font-size:calc(var(--s,48px) * .36);letter-spacing:.01em;box-shadow:0 0 0 3px #fff,0 6px 16px rgba(13,38,29,.14);position:relative}
.av-wrap{position:relative;flex:none}
.av-tick{position:absolute;right:-2px;bottom:-2px;width:20px;height:20px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center;box-shadow:0 0 0 2.5px #fff}
.av-tick .ic{width:12px;height:12px;stroke-width:3}

/* gradient icon tiles */
.chipi{display:grid;place-items:center;flex:none;width:var(--s,46px);height:var(--s,46px);border-radius:calc(var(--s,46px) * .32);color:#fff;background:var(--g-green);box-shadow:0 8px 18px rgba(13,38,29,.14)}
.chipi.amber{background:var(--g-amber)} .chipi.sky{background:var(--g-sky)} .chipi.rose{background:var(--g-rose)} .chipi.teal{background:var(--g-teal)} .chipi.lime{background:var(--g-lime)} .chipi.violet{background:var(--g-violet)}
.chipi.soft{background:var(--mint);color:var(--green-d);box-shadow:none}

/* proto bar */
.proto-bar{background:var(--night);color:var(--night-muted);font-size:.74rem;font-weight:600}
.proto-bar .wrap{display:flex;gap:10px;align-items:center;justify-content:space-between;min-height:34px;padding-block:5px}
.proto-bar button{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);color:#fff;border-radius:999px;padding:3px 11px;font-size:.72rem;font-weight:700}

/* floating pill nav */
.site-h{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;padding-block:10px;background:linear-gradient(180deg,rgba(246,251,248,.97),rgba(246,251,248,.8));-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px)}
.nav-inner{display:flex;align-items:center;gap:16px;min-height:62px;padding:8px 8px 8px 14px;border:1px solid rgba(220,235,229,.95);border-radius:24px;background:var(--glass);box-shadow:0 16px 40px rgba(17,82,58,.08)}
.brand{display:inline-flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);font-weight:800;font-size:1.2rem;letter-spacing:-.035em;transition:transform .18s ease}
.brand:hover{transform:scale(1.03)}
.brand svg{width:38px;height:38px;filter:drop-shadow(0 6px 12px rgba(25,169,114,.3))}
.brand small{display:block;font-size:.62rem;font-weight:700;letter-spacing:.14em;color:var(--green-d);text-transform:uppercase;line-height:1;margin-top:3px}
.nav-main{display:flex;gap:2px;flex:1;justify-content:center}
.nav-main a{padding:10px 13px;border-radius:999px;text-decoration:none;color:#40554c;font-weight:700;font-size:.9rem;transition:transform .18s ease,background .18s ease,color .18s ease}
.nav-main a:hover{color:var(--green-dd);background:var(--mint);transform:scale(1.05)}
.nav-main a[aria-current="page"]{color:var(--green-dd);background:var(--mint)}
.h-actions{display:flex;gap:8px;align-items:center;margin-left:auto}
.show-sm{display:none}
@media (max-width:1040px){.nav-main,.hide-sm{display:none}.show-sm{display:inline-grid}}
.drawer{position:fixed;inset:0;z-index:70;background:rgba(10,31,24,.45);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);display:flex;justify-content:flex-end}
.drawer-in{width:min(350px,90vw);height:100%;background:#fff;border-radius:26px 0 0 26px;padding:calc(18px + env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) 20px;display:flex;flex-direction:column;gap:4px;overflow:auto;box-shadow:var(--sh-l)}
.drawer-in a{display:flex;align-items:center;gap:12px;padding:12px 10px;border-radius:14px;text-decoration:none;color:var(--ink);font-weight:700}
.drawer-in a .ic{color:var(--green-d)}
.drawer-in a:hover{background:var(--mint)}

/* sections */
section{padding-block:clamp(56px,8vw,96px)}
.sec-head{display:flex;justify-content:space-between;align-items:flex-end;gap:18px;flex-wrap:wrap;margin-bottom:34px}
.sec-head .stack{--g:12px;max-width:660px}
.sec-head.center{flex-direction:column;align-items:center;text-align:center}
.sec-head.center .stack{align-items:center}
.sec-head p{color:var(--muted);line-height:1.75}
.alt{background:linear-gradient(180deg,#f8fdfb,#ecf8f2)}
.tint-white{background:#fff;border-block:1px solid var(--line)}

/* hero */
.hero{position:relative;overflow:hidden;padding-block:clamp(28px,5vw,64px) clamp(86px,9vw,120px);background:radial-gradient(circle at 82% 28%,#c9f6e2 0,transparent 32%),radial-gradient(circle at 8% 88%,#e4f8cf 0,transparent 30%),linear-gradient(180deg,#e7faf2,#f6fbf8)}
.hero::before,.hero::after{content:"";position:absolute;border-radius:50%;border:1px solid rgba(25,169,114,.14);pointer-events:none}
.hero::before{width:440px;height:440px;right:-120px;top:70px}
.hero::after{width:640px;height:640px;right:-220px;top:-30px}
.orb{position:absolute;border-radius:50%;filter:blur(90px);opacity:.35;pointer-events:none;animation:drift 14s ease-in-out infinite alternate}
.orb.a{width:300px;height:300px;background:#5eead4;left:-80px;top:60px}
.orb.b{width:260px;height:260px;background:#bef264;right:18%;bottom:-60px;animation-delay:-5s}
@keyframes drift{to{transform:translate(40px,-30px) scale(1.08)}}
.watermark{position:absolute;left:-10px;bottom:10px;font-family:var(--f-bn);font-size:clamp(90px,16vw,200px);font-weight:700;color:var(--green-dd);opacity:.04;line-height:1;pointer-events:none;user-select:none;white-space:nowrap}
.hero-grid{position:relative;z-index:2;display:grid;grid-template-columns:minmax(0,1.08fr) minmax(0,.92fr);gap:clamp(32px,5vw,64px);align-items:center}
.hero h1{margin-top:18px}
.hero .bnline{font-size:1.08rem;margin-top:12px;color:var(--ink-2)}
.ticks{display:flex;flex-wrap:wrap;gap:10px 20px;margin-top:20px;font-size:.92rem;font-weight:700;color:#36524a}
.ticks span{display:inline-flex;align-items:center;gap:7px}
.ticks .ic{color:var(--green);width:18px;height:18px}
.finder{margin-top:26px;background:rgba(255,255,255,.9);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid #d7eee3;border-radius:var(--r-l);box-shadow:var(--sh);padding:8px}
.seg{display:inline-flex;background:#eaf5ef;border-radius:14px;padding:4px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:8px 15px;border-radius:11px;font-weight:800;font-size:.86rem;color:var(--muted);transition:all .15s}
.seg button[aria-pressed="true"]{background:#fff;color:var(--green-dd);box-shadow:0 4px 12px rgba(17,82,58,.1)}
.finder-top{padding:6px 6px 4px}
.finder-fields{display:grid;grid-template-columns:repeat(3,minmax(0,1fr)) auto;gap:6px;padding:6px}
.finder-fields label{display:flex;flex-direction:column;gap:2px;padding:9px 13px;border-radius:14px;background:var(--sunk);min-width:0;border:1px solid transparent;transition:border-color .15s}
.finder-fields label:focus-within{border-color:var(--line-2);background:#fff}
.finder-fields label span{font-size:.66rem;color:var(--faint);font-weight:800;text-transform:uppercase;letter-spacing:.08em}
.finder-fields select{border:0;background:transparent;padding:0;font-weight:700;width:100%;min-width:0;box-shadow:none;outline:0}
.finder-fields .btn{border-radius:14px;height:100%;padding-inline:22px}
@media (max-width:640px){.finder-fields{grid-template-columns:1fr}.finder-fields .btn{padding-block:15px}}
.hero-photo{position:relative;max-width:470px;margin-left:auto;width:100%}
.hero-photo .offset{position:absolute;inset:0;border-radius:var(--r-xl);background:linear-gradient(135deg,#19a972,#0b5e3f);transform:translate(16px,16px)}
.hero-photo .frame{position:relative;aspect-ratio:4/5;max-width:100%;border-radius:var(--r-xl);overflow:hidden;border:5px solid #fff;box-shadow:var(--sh-l);background:var(--mint-2)}
.hero-photo .frame img{width:100%;height:100%;object-fit:cover;transition:transform .9s ease}
.hero-photo:hover .frame img{transform:scale(1.04)}
.hero-photo .frame::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(10,31,24,.45),transparent 45%)}
.photo-cap{position:absolute;right:14px;top:14px;z-index:2;color:#fff;font-weight:700;font-size:.7rem;display:flex;align-items:center;gap:6px;background:rgba(10,31,24,.45);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);padding:4px 10px;border-radius:999px}
.float{position:absolute;z-index:3;background:rgba(255,255,255,.95);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border:1px solid rgba(220,235,229,.9);border-radius:18px;box-shadow:var(--sh);padding:11px 14px;display:flex;align-items:center;gap:11px;font-size:.82rem;line-height:1.3}
.float b{display:block;font-size:.9rem;font-weight:800;color:var(--ink)}
.float small{color:var(--muted);font-weight:600}
.float.f1{left:-34px;top:38px;animation:bob 6s ease-in-out infinite}
.float.f2{right:-22px;bottom:84px;animation:bob 7s ease-in-out infinite reverse}
.float.f3{left:-18px;bottom:-22px;animation:bob 8s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px)}}
.stars{display:inline-flex;gap:1px;color:#f59e0b}
.stars .ic{width:14px;height:14px;fill:currentColor;stroke:none}
@media (max-width:900px){.hero-grid{grid-template-columns:1fr}.hero-photo{margin:10px auto 0;max-width:420px}.float.f1{left:-6px;top:52px}.float.f2{right:-6px}.float.f3{display:none}}
@media (max-width:480px){.hero-photo .frame{aspect-ratio:1/1}.float{padding:9px 11px;font-size:.76rem}.float.f2{bottom:22px}}

/* stat strip overlapping hero */
.statbar-wrap{position:relative;z-index:5;margin-top:-58px}
.statbar{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));background:#fff;border:1px solid var(--line);border-radius:var(--r-l);box-shadow:var(--sh)}
.statbar > div{display:flex;align-items:center;gap:13px;padding:20px 22px;min-width:0}
.statbar > div + div{border-left:1px solid var(--line)}
.statbar strong{display:block;font-size:1.06rem;font-weight:800;color:var(--ink);letter-spacing:-.02em;line-height:1.2}
.statbar strong + span{display:block;font-size:.78rem;font-weight:600;color:var(--muted);line-height:1.35}
@media (max-width:900px){.statbar{grid-template-columns:1fr 1fr}.statbar > div:nth-child(3){border-left:0}.statbar > div:nth-child(n+3){border-top:1px solid var(--line)}}
@media (max-width:420px){.statbar > div{padding:15px 14px;gap:10px}.statbar .chipi{--s:36px}}

/* audience doors */
.doors{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
.door{position:relative;display:flex;flex-direction:column;gap:14px;padding:26px;border-radius:var(--r-l);background:#fff;border:1px solid var(--line);text-align:left;min-width:0;box-shadow:var(--sh-s);transition:transform .25s ease,box-shadow .25s ease,border-color .25s ease;overflow:hidden}
.door:hover{transform:translateY(-5px);box-shadow:var(--sh);border-color:var(--line-2)}
.door p{color:var(--muted);font-size:.95rem;line-height:1.7}
.door .go{margin-top:auto;display:inline-flex;align-items:center;gap:8px;color:var(--green-d);font-weight:800;font-size:.92rem}
.door .go .ic{transition:transform .2s}
.door:hover .go .ic{transform:translateX(4px)}
.door .ghost-num{position:absolute;right:18px;top:10px;font-size:4.4rem;font-weight:800;color:var(--mint);letter-spacing:-.06em;line-height:1;pointer-events:none}
@media (max-width:860px){.doors{grid-template-columns:1fr}}

/* steps */
.steps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px;counter-reset:s;position:relative}
.step{position:relative;counter-increment:s;min-width:0;padding:26px 22px;border-radius:var(--r-l);background:#fff;border:1px solid var(--line);box-shadow:var(--sh-s)}
.step::before{content:counter(s,decimal-leading-zero);display:block;font-size:2.5rem;font-weight:800;letter-spacing:-.05em;line-height:1;margin-bottom:14px;background:linear-gradient(135deg,#a7e9cd,#19a972);-webkit-background-clip:text;background-clip:text;color:transparent}
.step h3{margin-bottom:6px}
.step p{color:var(--muted);font-size:.93rem;line-height:1.7}
@media (max-width:900px){.steps{grid-template-columns:1fr 1fr}}
@media (max-width:520px){.steps{grid-template-columns:1fr}}

/* curricula */
.curr{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.curr > div{position:relative;background:#fff;padding:24px;border-radius:var(--r-l);border:1px solid var(--line);display:flex;flex-direction:column;gap:10px;min-width:0;box-shadow:var(--sh-s);transition:transform .25s,box-shadow .25s,border-color .25s}
.curr > div:hover{transform:translateY(-5px);box-shadow:var(--sh);border-color:var(--line-2)}
.curr > div::after{content:"↗";position:absolute;right:22px;top:20px;color:var(--green);font-size:1.3rem;font-weight:800;transition:transform .2s}
.curr > div:hover::after{transform:translate(3px,-3px)}
.curr .bn{font-size:.92rem;margin-top:-4px}
.curr .row{--g:6px}
@media (max-width:860px){.curr{grid-template-columns:1fr 1fr}}
@media (max-width:540px){.curr{grid-template-columns:1fr}}

/* tutor cards */
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,268px),1fr));gap:20px}
.tcard{display:flex;flex-direction:column;gap:13px;padding:22px;background:#fff;border:1px solid var(--line);border-radius:var(--r-l);min-width:0;box-shadow:var(--sh-s);transition:transform .25s,box-shadow .25s,border-color .25s}
.tcard:hover{transform:translateY(-5px);box-shadow:var(--sh);border-color:var(--line-2)}
.tcard .who{display:flex;gap:14px;align-items:center;min-width:0}
.tcard .who > div{min-width:0}
.tcard .name{font-weight:800;font-size:1.05rem;letter-spacing:-.02em}
.tcard .inst{font-size:.82rem;color:var(--muted);line-height:1.4;font-weight:600}
.rating{display:inline-flex;align-items:center;gap:4px;font-weight:800;font-size:.88rem}
.rating .ic{width:15px;height:15px;color:#f59e0b;fill:#f59e0b;stroke:none}
.checks{display:flex;gap:6px;flex-wrap:wrap}
.checks span{display:inline-flex;align-items:center;gap:4px;font-size:.72rem;font-weight:800;color:var(--good);background:var(--good-soft);padding:3px 8px;border-radius:8px}
.checks span.no{color:var(--faint);background:var(--sunk)}
.checks .ic{width:12px;height:12px;stroke-width:2.6}
.tcard .foot{margin-top:auto;display:flex;justify-content:space-between;align-items:center;gap:8px;padding-top:14px;border-top:1px solid var(--line)}
.tcard .fee{font-weight:800;font-size:1rem;letter-spacing:-.01em}
.tcard .fee small{font-size:.72rem;color:var(--muted);font-weight:600}

/* vacancy card */
.notice-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr));gap:20px}
.notice{position:relative;display:flex;flex-direction:column;gap:12px;padding:22px;background:#fff;border:1px solid var(--line);border-radius:var(--r-l);box-shadow:var(--sh-s);min-width:0;transition:transform .25s,box-shadow .25s,border-color .25s}
.notice:hover{transform:translateY(-4px);box-shadow:var(--sh);border-color:#a9dfc6}
.n-head{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.n-code{font-size:.72rem;font-weight:800;letter-spacing:.06em;color:var(--faint)}
.n-badges{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.bdg{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:.68rem;font-weight:800;letter-spacing:.04em;text-transform:uppercase;line-height:1.4}
.bdg-urgent{background:var(--bad-soft);color:var(--bad)}
.bdg-bump{background:var(--g-amber);color:#fff;box-shadow:0 4px 10px rgba(249,115,22,.25)}
.bdg-new{background:var(--mint);color:var(--green-dd)}
.bdg-time{background:none;color:var(--faint);padding-inline:0;text-transform:none;letter-spacing:0;font-weight:700}
.n-title{font-weight:800;font-size:1.14rem;letter-spacing:-.025em;line-height:1.25}
.n-sub{color:var(--green-d);font-size:.84rem;font-weight:700;margin-top:-6px}
.n-meta{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 12px;font-size:.84rem;color:var(--muted);font-weight:600}
.n-meta span{display:flex;align-items:center;gap:7px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.n-meta .ic{width:15px;height:15px;color:var(--green)}
.n-via{display:flex;align-items:center;gap:7px;font-size:.8rem;font-weight:700;color:var(--good);background:var(--good-soft);padding:6px 10px;border-radius:10px}
.n-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:auto;padding-top:14px;border-top:1px solid var(--line);flex-wrap:wrap}
.n-pay{display:flex;flex-direction:column;gap:1px}
.salary{font-weight:800;font-size:1.32rem;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1.15}
.salary small{font-size:.74rem;color:var(--muted);font-weight:600;letter-spacing:0}
.n-fee{font-size:.72rem;color:var(--faint);font-weight:700}
.urgent{color:var(--bad)}
.bump{color:#ea580c}
.applied-tag{display:inline-flex;align-items:center;gap:6px;color:var(--good);font-weight:800;font-size:.88rem;background:var(--good-soft);padding:7px 12px;border-radius:999px}
.notice.mini{padding:16px 18px;gap:9px;max-width:340px}
.notice.mini .n-title{font-size:1.02rem}

/* filters */
.layout-filter{display:grid;grid-template-columns:270px minmax(0,1fr);gap:28px;align-items:start}
.filters{position:sticky;top:calc(96px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:16px;padding:22px;background:#fff;border:1px solid var(--line);border-radius:var(--r-l);box-shadow:var(--sh-s)}
@media (max-width:900px){.layout-filter{grid-template-columns:1fr}.filters{position:static}}
.field{display:flex;flex-direction:column;gap:7px;min-width:0}
.field > span,.field legend{font-size:.8rem;font-weight:800;color:#3c5248}
.field small{color:var(--muted);font-size:.78rem}
input[type=text],input[type=tel],input[type=email],input[type=number],input[type=search],select,textarea{width:100%;min-width:0;padding:12px 14px;border-radius:13px;border:1px solid #d3e6dd;background:#fff;font-size:.96rem;color:var(--ink);transition:border-color .15s,box-shadow .15s}
textarea{min-height:100px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--green);box-shadow:0 0 0 4px rgba(25,169,114,.13)}
fieldset{border:0;padding:0;margin:0;min-width:0}
.check{display:flex;gap:10px;align-items:flex-start;font-size:.9rem;color:var(--ink-2)}
.check input{margin-top:4px;accent-color:var(--green);width:17px;height:17px}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.form-grid .full{grid-column:1/-1}
@media (max-width:600px){.form-grid{grid-template-columns:1fr}}
.count{font-size:.8rem;font-weight:800;color:var(--muted);letter-spacing:.02em}
.empty{padding:44px 20px;text-align:center;color:var(--muted);border:1.5px dashed var(--line-2);border-radius:var(--r-l);background:#fff}

/* panels */
.panel{background:#fff;border:1px solid var(--line);border-radius:22px;padding:22px;min-width:0;box-shadow:var(--sh-s)}
.panel-h{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}

/* night band */
.band,.night{position:relative;overflow:hidden;background:radial-gradient(ellipse at 50% 0%,#14402f 0%,#0a1f18 58%,#05130e 100%);color:var(--on-night)}
.band::before,.night::before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.8) 1.1px,transparent 1.2px);background-size:22px 22px;opacity:.05;pointer-events:none}
.band::after,.night::after{content:"";position:absolute;width:520px;height:520px;right:-140px;top:-160px;border-radius:50%;background:#19a972;filter:blur(140px);opacity:.28;pointer-events:none}
.band > *,.night > *{position:relative;z-index:1}
.band h1,.band h2,.band h3,.night h1,.night h2,.night h3{color:#fff}
.band .lede,.band .muted,.night .lede,.night .muted{color:var(--night-muted)}
.band .eyebrow,.night .eyebrow{background:rgba(25,169,114,.14);border-color:rgba(52,211,153,.35);color:#6ee7b7;box-shadow:none}
.band .grad,.night .grad{background:linear-gradient(90deg,#6ee7b7,#bef264);-webkit-background-clip:text;background-clip:text}
.band .btn-ghost,.night .btn-ghost,.next .btn-ghost,.auth-side .btn-ghost{background:rgba(255,255,255,.07);color:#fff;border-color:rgba(255,255,255,.2)}
.band .btn-ghost:hover,.night .btn-ghost:hover,.next .btn-ghost:hover{background:rgba(255,255,255,.14);color:#fff}
.band-grid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:44px;align-items:center}
@media (max-width:860px){.band-grid{grid-template-columns:1fr}}
.ledger{background:var(--night-glass);border:1px solid var(--night-line);border-radius:var(--r-l);padding:22px;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);box-shadow:0 30px 60px rgba(0,0,0,.25);font-variant-numeric:tabular-nums}
.ledger .eyebrow{margin-bottom:8px}
.ledger .l{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px dashed rgba(255,255,255,.12);font-size:.92rem;font-weight:600;color:#cfe3da}
.ledger .l span:last-child{font-weight:800;color:#fff}
.ledger .l:last-child{border-bottom:0;font-size:1.06rem}
.ledger .l:last-child span:last-child{color:#6ee7b7;font-size:1.3rem}
.ledger .field > span{color:#cfe3da}
.ledger input,.ledger select{background:rgba(255,255,255,.06);color:#fff;border-color:rgba(255,255,255,.18)}
.ledger select option{color:var(--ink)}
.ledger .seg{background:rgba(255,255,255,.08)}
.ledger .seg button{color:#cfe3da}
.ledger .seg button[aria-pressed="true"]{background:#fff;color:var(--green-dd)}

/* testimonials slider */
.tslider{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:20px;padding:6px 4px 22px;scrollbar-width:none}
.tslider::-webkit-scrollbar{display:none}
.quote{scroll-snap-align:center;flex:0 0 min(86%,380px);position:relative;display:flex;flex-direction:column;gap:18px;padding:28px;border-radius:28px;background:linear-gradient(160deg,#fff,#f1fbf6);border:1px solid var(--line);box-shadow:var(--sh-s);transition:transform .25s,box-shadow .25s}
.quote:hover{transform:translateY(-4px);box-shadow:var(--sh)}
.quote .qmark{position:absolute;right:22px;top:16px;font-size:4.5rem;line-height:1;font-weight:800;color:#c6ecda;font-family:Georgia,serif}
.quote p{font-size:1.02rem;line-height:1.7;color:var(--ink-2);font-weight:600}
.quote .by{display:flex;align-items:center;gap:12px;margin-top:auto;padding-top:16px;border-top:1px solid var(--line)}
.quote .by b{display:block;font-weight:800}
.quote .by small{font-size:.7rem;font-weight:800;color:var(--green-d);text-transform:uppercase;letter-spacing:.08em}
.swipe-hint{text-align:center;font-size:.74rem;font-weight:800;color:var(--faint);letter-spacing:.12em;text-transform:uppercase}

/* faq */
details{background:#fff;border:1px solid var(--line);border-radius:18px;padding:2px 20px;margin-bottom:10px;transition:box-shadow .2s,border-color .2s}
details[open]{box-shadow:var(--sh-s);border-color:var(--line-2)}
summary{cursor:pointer;list-style:none;padding:16px 0;font-weight:800;font-size:1rem;display:flex;justify-content:space-between;align-items:center;gap:16px;letter-spacing:-.01em}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";display:grid;place-items:center;flex:none;width:28px;height:28px;border-radius:50%;background:var(--mint);color:var(--green-d);font-weight:800;transition:transform .2s}
details[open] summary::after{transform:rotate(45deg)}
details > p,details > div{padding:0 0 18px;color:var(--muted);max-width:72ch;line-height:1.75}
.chart details,.panel details,.ledger details{background:none;border:0;padding:0;margin:0;box-shadow:none}
.panel details summary,.chart details summary{font-size:.84rem;padding:8px 0;color:var(--muted)}
.panel details summary::after,.chart details summary::after{width:22px;height:22px;font-size:.8rem}

/* CTA */
.cta{position:relative;overflow:hidden;display:flex;justify-content:space-between;align-items:center;gap:28px;flex-wrap:wrap;padding:clamp(30px,5vw,56px);border-radius:30px;color:#fff;background:linear-gradient(135deg,#0b7d52,#19a972 60%,#14b8a6);box-shadow:0 30px 70px rgba(13,131,86,.25)}
.cta::before{content:"";position:absolute;width:380px;height:380px;right:-80px;top:-160px;border-radius:50%;background:rgba(255,255,255,.14)}
.cta::after{content:"";position:absolute;width:220px;height:220px;left:30%;bottom:-140px;border-radius:50%;border:1px solid rgba(255,255,255,.25)}
.cta > *{position:relative;z-index:1}
.cta h2{color:#fff}
.cta p{color:rgba(255,255,255,.85)}
.cta .btn-ghost{background:rgba(255,255,255,.12);color:#fff;border-color:rgba(255,255,255,.3)}
.cta .btn-white{background:#fff;color:var(--green-dd);box-shadow:0 12px 26px rgba(0,0,0,.15)}
.hotnum{font-weight:800;user-select:all;white-space:nowrap}

/* page head */
.page-head{position:relative;overflow:hidden;padding-block:clamp(40px,6vw,76px) clamp(34px,4vw,48px);background:radial-gradient(circle at 85% 20%,#cdf6e4 0,transparent 30%),linear-gradient(180deg,#e7faf2,#f6fbf8);text-align:center}
.page-head::after{content:"";position:absolute;width:520px;height:520px;right:-200px;top:-200px;border-radius:50%;border:1px solid rgba(25,169,114,.14)}
.page-head .stack{--g:14px;max-width:760px;margin-inline:auto;align-items:center;position:relative;z-index:1}
.page-head h1{font-size:clamp(2.1rem,3.6vw + 1rem,3.4rem)}

/* abroad countries */
.countries{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}
.country{position:relative;border-radius:var(--r-l);overflow:hidden;background:#fff;border:1px solid var(--line);min-width:0;text-align:left;padding:0;box-shadow:var(--sh-s);transition:transform .25s,box-shadow .25s}
.country:hover{transform:translateY(-5px);box-shadow:var(--sh)}
.country .art{aspect-ratio:16/10;max-width:100%;display:flex;align-items:flex-end;justify-content:space-between;padding:14px 16px;position:relative;background:linear-gradient(135deg,hsl(var(--h) 70% 52%),hsl(calc(var(--h) + 32) 65% 34%));color:#fff;overflow:hidden}
.country .art b{font-size:2.6rem;font-weight:800;letter-spacing:-.05em;line-height:1;position:relative;z-index:1}
.country .art svg{position:absolute;inset:0;width:100%;height:100%;opacity:.35}
.country .art .ic{position:relative;z-index:1;width:22px;height:22px;opacity:.85}
.country .body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:3px}
.country .body b{font-weight:800}
.country .body span{font-size:.82rem}
@media (max-width:900px){.countries{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* articles */
.agrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px}
.article{display:flex;flex-direction:column;gap:10px;text-align:left;background:none;border:0;padding:0;min-width:0;color:var(--ink)}
.article .cover{aspect-ratio:16/10;max-width:100%;width:100%;border-radius:var(--r-l);background:linear-gradient(135deg,hsl(var(--h) 70% 55%),hsl(calc(var(--h) + 34) 62% 32%));display:flex;align-items:flex-end;padding:18px;position:relative;overflow:hidden;box-shadow:var(--sh-s);transition:transform .3s,box-shadow .3s}
.article .cover::before{content:"";position:absolute;width:200px;height:200px;right:-60px;top:-60px;border-radius:50%;background:rgba(255,255,255,.16)}
.article .cover span{position:relative;font-weight:800;font-size:clamp(1.8rem,3.6vw,2.6rem);color:#fff;line-height:.95;letter-spacing:-.05em}
.article:hover .cover{transform:translateY(-4px);box-shadow:var(--sh)}
.article h3{font-size:1.12rem}
.article .eyebrow{background:none;border:0;padding:0;box-shadow:none}
@media (max-width:860px){.agrid{grid-template-columns:1fr 1fr}}
@media (max-width:560px){.agrid{grid-template-columns:1fr}}
.reader{max-width:68ch;margin-inline:auto;display:flex;flex-direction:column;gap:18px;font-size:1.08rem;line-height:1.8;color:var(--ink-2)}

/* tables */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:18px;background:#fff;box-shadow:var(--sh-s)}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{text-align:left;padding:13px 15px;border-bottom:1px solid var(--line);vertical-align:middle;white-space:nowrap}
th{font-weight:800;font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);background:#f3faf6}
tr:last-child td{border-bottom:0}
tbody tr{transition:background .15s}
tbody tr:hover{background:#f8fdfa}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}

/* request flow */
.flow{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:28px;align-items:start}
@media (max-width:900px){.flow{grid-template-columns:1fr}}
.progress-steps{display:flex;gap:6px;margin-bottom:22px}
.progress-steps i{flex:1;height:6px;border-radius:4px;background:var(--sunk)}
.progress-steps i.on{background:var(--g-cta)}
.summary-card{position:sticky;top:calc(96px + env(safe-area-inset-top,0px));background:linear-gradient(180deg,#fff,#f3fbf7)}
.summary-card dl{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;margin:0;font-size:.9rem}
.summary-card dt{color:var(--muted);font-weight:600} .summary-card dd{margin:0;font-weight:800;min-width:0;overflow-wrap:anywhere}
.chips-wrap{display:flex;flex-wrap:wrap;gap:8px}
.done-mark{width:68px;height:68px;border-radius:22px;display:grid;place-items:center;background:var(--g-cta);color:#fff;box-shadow:var(--sh-glow)}
.done-mark .ic{width:34px;height:34px;stroke-width:2.6}

/* login portal */
.portal-page{padding-block:clamp(20px,4vw,48px) 64px;background:radial-gradient(circle at 85% 10%,#cdf6e4 0,transparent 30%),linear-gradient(180deg,#e7faf2,#f6fbf8)}
.auth{display:grid;grid-template-columns:minmax(0,.95fr) minmax(0,1.05fr);border-radius:30px;overflow:hidden;background:#fff;border:1px solid var(--line);box-shadow:var(--sh-l);min-height:620px}
.auth-side{position:relative;color:#fff;padding:clamp(28px,4vw,48px);display:flex;flex-direction:column;justify-content:flex-end;gap:16px;background-size:cover;background-position:center 30%;overflow:hidden}
.auth-side::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,31,24,.15) 0%,rgba(10,31,24,.55) 45%,rgba(10,31,24,.92) 100%)}
.auth-side > *{position:relative;z-index:1}
.auth-side h2{color:#fff}
.auth-side .muted{color:#cfe3da}
.auth-side .chip{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.18)}
.auth-main{padding:clamp(24px,4vw,48px);display:flex;justify-content:center;align-items:flex-start}
.auth-box{width:min(440px,100%);display:flex;flex-direction:column;gap:18px}
.roles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.role{display:flex;align-items:flex-start;gap:11px;text-align:left;padding:13px;border:1.5px solid var(--line);border-radius:16px;background:#fff;transition:all .15s}
.role:hover{border-color:var(--line-2);background:#fbfefc}
.role[aria-pressed="true"]{border-color:var(--green);background:var(--mint);box-shadow:0 8px 18px rgba(25,169,114,.14)}
.role b{display:block;font-weight:800;font-size:.9rem;line-height:1.25}
.role small{display:block;color:var(--muted);line-height:1.3;font-size:.74rem;margin-top:2px}
.role .chipi{--s:34px;border-radius:11px}
.phone-in{display:flex;border:1px solid #d3e6dd;border-radius:13px;overflow:hidden;background:#fff;transition:border-color .15s,box-shadow .15s}
.phone-in:focus-within{border-color:var(--green);box-shadow:0 0 0 4px rgba(25,169,114,.13)}
.phone-in span{padding:12px 13px;border-right:1px solid var(--line);font-weight:800;color:var(--muted);background:var(--sunk)}
.phone-in input{border:0;border-radius:0;box-shadow:none!important}
.otp{letter-spacing:.6em;font-size:1.35rem;text-align:center;font-weight:800}
.notice-flash{padding:12px 14px;border-radius:14px;background:var(--amber-soft);color:var(--amber-ink);font-size:.9rem;font-weight:600;display:flex;gap:10px;align-items:flex-start;border:1px solid #f3d79b}
.demo-list{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media (max-width:860px){.auth{grid-template-columns:1fr;min-height:0}.auth-side{min-height:240px}}
@media (max-width:420px){.roles{grid-template-columns:1fr}}

/* footer */
.site-f{position:relative;overflow:hidden;color:rgba(255,255,255,.78);background:radial-gradient(ellipse at 50% 0%,#12382a 0%,#0a1f18 55%,#05130e 100%);border-top:1px solid rgba(25,169,114,.24)}
.site-f::before{content:"";position:absolute;top:0;left:10%;right:10%;height:1px;background:linear-gradient(90deg,transparent,rgba(52,211,153,.7),transparent)}
.f-trust{border-bottom:1px solid rgba(255,255,255,.07);background:rgba(255,255,255,.02);padding-block:28px}

.gl-big{font-size:1.6rem!important;font-weight:800!important;letter-spacing:-.04em;color:var(--ink)!important}

@media (max-width:520px){.gl-card{flex-direction:column;align-items:flex-start;gap:10px;padding:14px}.gl-card .ring{--rs:62px!important}}

/* partner scorecard */
.scorecard{display:flex;flex-direction:column;gap:16px;padding:18px}
.bal{position:relative;overflow:hidden;display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;padding:18px 20px;border-radius:18px;color:#fff;background:linear-gradient(135deg,#0b5e3f,#0d8356 55%,#19a972)}

.sc-sum b{color:var(--ink);font-weight:800}
.mx{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:18px;overflow:hidden}
.mx-row{display:grid;grid-template-columns:minmax(80px,.85fr) repeat(3,minmax(0,1fr));align-items:center}
.mx-row + .mx-row{border-top:1px solid var(--line)}
.mx-row > *{padding:12px 10px;min-width:0}
.mx-row > * + *{border-left:1px solid var(--line)}
.mx-head{background:#f3faf6}
.mx-type{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.mx-type b{font-size:.78rem;font-weight:800;line-height:1.2}
.mx-l{font-size:.78rem;font-weight:800;color:var(--muted)}
.mx-v{display:flex;justify-content:center;text-align:center;font-weight:800;font-size:1.02rem;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
@media (max-width:420px){.mx-row > *{padding:10px 6px}.mx-v{font-size:.9rem}.mx-l{font-size:.72rem}}

/* create referral */
.refnew{display:flex;flex-direction:column;gap:16px}
.refnew-h{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}
.refnew-h .seg button{display:inline-flex;align-items:center;gap:6px}
.code-mini{display:inline-flex;align-items:center;gap:10px;padding:6px 6px 6px 14px;border:1.5px dashed #8fd8b6;border-radius:999px;background:#effcf6;font-size:.82rem}
.code-mini b{letter-spacing:.06em;color:var(--green-dd)}

/* progression profile */
.prog{display:flex;flex-direction:column;gap:20px;background:linear-gradient(180deg,#fff,#f6fcf9)}
.prog-h{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
.prog-me{display:flex;align-items:center;gap:16px}
.prog-me h3{font-size:1.4rem;margin-top:2px}
.prog-rates{display:flex;gap:8px;flex-wrap:wrap}
.rate{display:flex;flex-direction:column;padding:9px 14px;border-radius:14px;background:#fff;border:1px solid var(--line);min-width:96px}
.rate small{font-size:.66rem;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.rate b{font-size:1.15rem;font-weight:800;letter-spacing:-.03em}
.prog-next{display:flex;flex-direction:column;gap:8px}
.prog-meter{height:12px}
.ladder{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;align-items:end}
.rung{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;padding:12px 4px;border-radius:16px;border:1px solid transparent;min-width:0}
.rung b{font-size:.82rem;font-weight:800}
.rung small{font-size:.66rem;color:var(--muted);font-weight:700;line-height:1.3}
.rung.later .tbadge{filter:grayscale(1) opacity(.45)}
.rung.later b{color:var(--faint)}
.rung.now{background:#fff;border-color:var(--line-2);box-shadow:var(--sh-s)}
.rung.now b::after{content:" · you";color:var(--green-d)}
@media (max-width:480px){.ladder{gap:4px}.rung{padding:10px 2px}.rung small:last-child{display:none}.rung.now b::after{content:""}}

/* simulator (ZNF-style sliders) */
.sim{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;padding:20px;border-radius:20px;background:#fff;border:1px solid var(--line)}
@media (max-width:820px){.sim{grid-template-columns:1fr;padding:16px}}
.sim-in{display:flex;flex-direction:column;gap:18px}
.sl-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px}
.sl-top label{display:inline-flex;align-items:center;gap:7px;font-size:.86rem;font-weight:700;color:#3c5248}
.sl-top label .ic{color:var(--faint)}
.sl-top b{font-weight:800;font-size:1.02rem;font-variant-numeric:tabular-nums}
.sl-scale{display:flex;justify-content:space-between;font-size:.66rem;font-weight:700;color:var(--faint);margin-top:4px}
.rng{-webkit-appearance:none;appearance:none;width:100%;height:9px;border-radius:999px;background:linear-gradient(90deg,var(--c) 0 var(--p),#e3eee8 var(--p) 100%);outline:none;cursor:pointer;margin:0;padding:0;border:0}
.rng::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:24px;height:24px;border-radius:50%;background:#fff;border:5px solid var(--c);box-shadow:0 4px 12px rgba(13,38,29,.25);cursor:grab;transition:transform .15s}
.rng::-webkit-slider-thumb:active{transform:scale(1.15);cursor:grabbing}
.rng::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:#fff;border:5px solid var(--c);box-shadow:0 4px 12px rgba(13,38,29,.25);cursor:grab}
.rng:focus-visible{box-shadow:0 0 0 4px rgba(25,169,114,.2)}
.sim-out{display:flex;flex-direction:column;gap:14px;padding:18px;border-radius:18px;background:linear-gradient(160deg,#0f2e23,#0a1f18);color:#eaf6f0}
.sim-out .muted{color:#9cb8ad}
.sim-out .eyebrow.plain{color:#6ee7b7}
.sim-big{font-size:2.5rem;font-weight:800;letter-spacing:-.05em;line-height:1.05;font-variant-numeric:tabular-nums;background:linear-gradient(90deg,#6ee7b7,#bef264);-webkit-background-clip:text;background-clip:text;color:transparent}
.stackbar{display:flex;height:12px;border-radius:999px;overflow:hidden;background:rgba(255,255,255,.08);gap:2px}
.stackbar i{display:block;height:100%;transition:width .25s ease}
.sim-rows{display:flex;flex-direction:column;gap:8px;font-size:.82rem}
.sim-rows div{display:flex;align-items:center;gap:8px}
.sim-rows span:nth-child(2){flex:1;color:#b9d2c7;font-weight:600}
.sim-rows b{font-weight:800;font-variant-numeric:tabular-nums}
.dot{width:9px;height:9px;border-radius:50%;flex:none}
.bands{display:flex;gap:3px}
.bands > div{display:flex;flex-direction:column;gap:5px;min-width:0}
.bands i{display:block;height:8px;border-radius:4px}
.bands small{font-size:.64rem;font-weight:800;color:#b9d2c7;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sim-status{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:14px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1)}
.sim-status b{display:block;color:#fff;font-weight:800}
.sim-status small{color:#9cb8ad;font-weight:600;font-size:.78rem}

/* videos */
.vids{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media (max-width:700px){.vids{grid-template-columns:1fr}}
.vid{display:flex;flex-direction:column;text-align:left;padding:0;border:1px solid var(--line);border-radius:22px;overflow:hidden;background:#fff;box-shadow:var(--sh-s);transition:transform .25s,box-shadow .25s}
.vid:hover{transform:translateY(-4px);box-shadow:var(--sh)}
.vid-thumb{position:relative;aspect-ratio:16/9;max-width:100%;background:radial-gradient(circle at 80% 20%,rgba(255,255,255,.25),transparent 40%),linear-gradient(135deg,hsl(var(--h) 70% 42%),hsl(calc(var(--h) + 30) 70% 22%));color:#fff;display:grid;place-items:center;overflow:hidden}
.vid-play{width:64px;height:64px;border-radius:50%;background:rgba(255,255,255,.95);color:#e11d48;display:grid;place-items:center;box-shadow:0 10px 30px rgba(0,0,0,.3);transition:transform .2s;position:relative;z-index:1}
.vid-play .ic{width:26px;height:26px;fill:currentColor;stroke:none;margin-left:3px}
.vid:hover .vid-play{transform:scale(1.08)}
.vid-dur{position:absolute;right:12px;bottom:12px;background:rgba(0,0,0,.6);padding:2px 8px;border-radius:6px;font-size:.74rem;font-weight:800}
.vid-yt{position:absolute;left:12px;top:12px;display:inline-flex;align-items:center;gap:5px;background:rgba(0,0,0,.35);padding:3px 9px;border-radius:999px;font-size:.7rem;font-weight:800}
.vid-ic{position:absolute;left:14px;bottom:10px;opacity:.35}
.vid-ic .ic{width:44px;height:44px}
.vid-body{display:flex;flex-direction:column;gap:3px;padding:14px 16px 16px}
.vid-body b{font-weight:800;font-size:.98rem;letter-spacing:-.01em}
.vid-body span{font-size:.84rem}

/* ops */
.kpi-more{margin-top:6px;align-self:flex-start;display:inline-flex;align-items:center;gap:4px;padding:5px 0 0;border:0;background:none;color:var(--green-d);font-size:.74rem;font-weight:800;border-top:1px dashed var(--line);width:100%;justify-content:space-between}
.kpi-more .ic{width:14px;height:14px;transition:transform .2s}
.kpi-more:hover .ic{transform:translateX(3px)}
.links{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
@media (max-width:900px){.links{grid-template-columns:1fr}}
.linkcard{display:flex;align-items:center;gap:14px;padding:16px;border-radius:20px;border:1px solid var(--line);background:#fff;text-align:left;box-shadow:var(--sh-s);transition:transform .2s,box-shadow .2s,border-color .2s;min-width:0}
.linkcard:hover{transform:translateY(-3px);box-shadow:var(--sh);border-color:var(--line-2)}
.linkcard .grow{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.linkcard b{font-weight:800;font-size:.94rem}
.linkcard span{font-size:.8rem;color:var(--muted);font-weight:600}
.linkcard > .ic{color:var(--green-d)}
.dbf{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;padding:14px;border-radius:16px;background:var(--sunk);margin-bottom:8px}
@media (max-width:900px){.dbf{grid-template-columns:1fr 1fr}}
.db-row .grow{min-width:200px}
.db-row .s .ic{width:13px;height:13px;vertical-align:-2px}
.vstat-sum{display:flex;gap:8px;flex-wrap:wrap}
.vstat-sum .chip b{color:var(--green-dd)}
.vlist{display:flex;flex-direction:column;gap:10px}
.vrow{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;padding:15px 18px;border-radius:18px;border:1px solid var(--line);background:#fff;text-align:left;box-shadow:var(--sh-s);transition:transform .2s,box-shadow .2s,border-color .2s}
.vrow:hover{transform:translateY(-2px);box-shadow:var(--sh);border-color:var(--line-2)}
.vrow-main{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1 1 240px}
.vrow-main b{font-weight:800;font-size:1rem}
.vrow-main .muted{font-size:.82rem;font-weight:600}
.vrow-side{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.vrow-meta{font-size:.76rem;color:var(--muted);font-weight:700}
.vrow-next{display:inline-flex;align-items:center;gap:5px;font-size:.76rem;font-weight:800;color:var(--ink-2);background:var(--sunk);padding:4px 9px;border-radius:8px}
.sheet.wide{width:min(760px,100%)}
.sheet .kv{grid-template-columns:repeat(auto-fill,minmax(min(100%,140px),1fr));gap:8px}
.sheet .kv div{padding:10px 12px}
.gl-card.gl-views{align-items:stretch}
.vm-status{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;border-radius:16px;background:var(--sunk)}
.vm-word{font-size:1.3rem;font-weight:800;letter-spacing:-.03em;padding:4px 14px;border-radius:12px}
.vm-next{display:flex;gap:14px;align-items:flex-start;padding:16px;border-radius:18px;border:1px solid var(--line-2);background:linear-gradient(135deg,#f3fcf8,#e8f8ef)}
.vm-next .grow{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}

.vm-next p{color:var(--ink-2);font-size:.9rem}
.vm-next .chip{width:fit-content;margin-top:4px}

.u-cap-list{display:flex;flex-direction:column;gap:10px;margin-top:6px}

.u-door-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.u-door-step{font-size:.7rem;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}

.u-door-desc{font-size:.9rem;color:var(--muted);line-height:1.55}
.u-door-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;padding:12px;border-radius:16px;background:var(--bg);border:1px solid var(--line)}

.u-door-stats b{font-size:1.05rem;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.u-door-stats small{font-size:.68rem;font-weight:700;color:var(--muted)}
.u-door-links{display:flex;flex-wrap:wrap;gap:6px}
.u-door-links button{font-size:.76rem;font-weight:700;padding:5px 10px;border-radius:999px;border:1px solid var(--line);background:#fff;color:var(--ink-2);transition:all .15s}
.u-door-links button:hover{background:var(--mint);border-color:var(--line-2);color:var(--green-dd)}
.u-ws-banner{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;padding:18px 22px;border-radius:22px;background:#fff;border:1px solid var(--line);box-shadow:var(--sh-s)}
.u-subnav{display:flex;align-items:center;gap:6px;overflow-x:auto;padding:6px;border-radius:16px;background:#fff;border:1px solid var(--line);box-shadow:var(--sh-s)}
.u-subnav button{display:inline-flex;align-items:center;gap:8px;padding:9px 15px;border-radius:11px;border:0;background:transparent;font-weight:800;font-size:.86rem;color:var(--muted);white-space:nowrap;transition:all .15s}
.u-subnav button:hover{color:var(--ink);background:var(--bg)}
.u-subnav button[aria-current="page"]{background:var(--mint);color:var(--green-dd)}
.u-subnav .badge{font-size:.68rem;font-weight:800;background:var(--green);color:#fff;border-radius:999px;padding:1px 7px}
.side-sub{display:flex;flex-direction:column;gap:2px;padding-left:14px;margin:2px 0 6px;border-left:2px solid rgba(52,211,153,.28)}
.side-sub-link{display:flex;align-items:center;gap:9px;padding:7px 10px;border-radius:10px;border:0;background:transparent;text-align:left;color:#93b1a6;font-weight:700;font-size:.82rem;width:100%;transition:all .15s}

.side-sub-link[aria-current="page"]{color:#6ee7b7;background:rgba(25,169,114,.16)}

function barChart(data,{fmt=v=>v,label='Value'}={}){
  const W=600,H=220,pl=44,pr=10,pt=24,pb=28;
  const max=Math.max(...data.map(d=>d.v));
  const step=niceStep(max/4); const top=Math.ceil(max/step)*step||1;
  const iw=W-pl-pr, ih=H-pt-pb, bw=iw/data.length, barW=Math.min(42,bw*.56);
  const y=v=>pt+ih-(v/top)*ih;
  let g='';
  for(let t=0;t<=top+1e-9;t+=step){g+=`<line class="gl" x1="${pl}" x2="${W-pr}" y1="${y(t)}" y2="${y(t)}"/><text class="ax" x="${pl-8}" y="${y(t)+4}" text-anchor="end">${fmt(t)}</text>`;}
  data.forEach((d,i)=>{
    const x=pl+i*bw+(bw-barW)/2, yy=y(d.v), h=pt+ih-yy, r=Math.min(4,h);
    const path=h>0?`M${x},${pt+ih} V${yy+r} Q${x},${yy} ${x+r},${yy} H${x+barW-r} Q${x+barW},${yy} ${x+barW},${yy+r} V${pt+ih} Z`:'';
    g+=`<g class="b"><title>${esc(d.k)}: ${fmt(d.v)}</title><rect class="hit" x="${pl+i*bw}" y="${pt}" width="${bw}" height="${ih}"/>${path?`<path class="bar" d="${path}"/>`:''}<text class="ax" x="${x+barW/2}" y="${H-8}" text-anchor="middle">${esc(d.k)}</text>${i===data.length-1?`<text class="lbl" x="${x+barW/2}" y="${yy-7}" text-anchor="middle">${fmt(d.v)}</text>`:''}</g>`;
  });
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(label)} bar chart">${g}</svg>
  <details><summary>Show as table</summary><div class="tbl-wrap"><table><thead><tr><th>Period</th><th class="num">${esc(label)}</th></tr></thead><tbody>${data.map(d=>`<tr><td>${esc(d.k)}</td><td class="num">${fmt(d.v)}</td></tr>`).join('')}</tbody></table></div></details></div>`;
}
function niceStep(x){const p=Math.pow(10,Math.floor(Math.log10(x||1)));const n=x/p;return (n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10)*p;}
const opts=(arr,sel,blank)=>(blank?`<option value="">${blank}</option>`:'')+arr.map(a=>`<option ${a===sel?'selected':''}>${esc(a)}</option>`).join('');

const EARLY={durs:['Less than 21 days','1 month','2 months','3 months','4 months or more'],
 reasons:[['other','No special reason (pre-agreed fee)',[12,15,25,35,50],'Pre-agreed'],['guardian','Guardian moved abroad or dropped the subject',[0,12.5,22.5,32.5,50],'Guardian stopped'],['dismissed','Tutor dismissed for discipline or teaching method','full','Dismissed'],['left','Tutor left by choice','full','Left by choice'],['refer','Tutor left but referred the student back for a replacement',[5,15,25,35,50],'Left + referred back']]};
function feeOut(){
  const f=S.fee,sal=Number(f.sal)||0,d=Number(f.dur)||0,r=EARLY.reasons.find(x=>x[0]===f.reason)||EARLY.reasons[0];
  const full=r[2]==='full',pct=full?50:r[2][d],amt=Math.round(sal*pct/100);
  const note=full?'The full commission applies (60% on a Bumper vacancy).':pct===0?'No commission.':r[0]==='refer'?'Once the replacement tutor is confirmed, you also get the Partner Program referral fee as cash back.':pct===50?'The full commission applies.':'A reduced commission, because the tuition ended early.';
  return `<div class="fee-result"><div><span class="eyebrow">You pay</span><div class="fee-big tnum">${tk(amt)}</div><div class="muted" style="font-size:.88rem">${pct}% of one month’s salary</div></div><p style="font-size:.92rem">${note}</p></div><p class="faint" style="font-size:.8rem;margin-top:8px">All percentages are of one month’s salary.</p>`;
}
function feeTable(){
  const cell=(r,i)=>r[2]==='full'?'Full fee':r[2][i]+'%';
  return `<div class="tbl-wrap" style="margin-top:8px"><table><thead><tr><th>Taught for</th>${EARLY.reasons.map(r=>`<th>${r[3]}</th>`).join('')}</tr></thead><tbody>${EARLY.durs.map((d,i)=>`<tr><td>${d}</td>${EARLY.reasons.map(r=>`<td>${cell(r,i)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
}

let GID=0; const gid=()=>'g'+(++GID);
function ring(pct,{size=72,c1='#2dd4bf',c2='#0d8356',center='',sub=''}={}){
  const id=gid(),r=27,C=2*Math.PI*r,p=Math.max(0,Math.min(1,pct));
  return `<div class="ring" style="--rs:${size}px"><svg viewBox="0 0 64 64" aria-hidden="true"><defs><linearGradient id="${id}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${c1}"/><stop offset="1" stop-color="${c2}"/></linearGradient></defs><circle cx="32" cy="32" r="${r}" fill="none" stroke="#e5f1eb" stroke-width="7"/><circle cx="32" cy="32" r="${r}" fill="none" stroke="url(#${id})" stroke-width="7" stroke-linecap="round" stroke-dasharray="${(C*p).toFixed(1)} ${C.toFixed(1)}" transform="rotate(-90 32 32)"/></svg><span class="ring-c">${center}${sub?`<small>${sub}</small>`:''}</span></div>`;
}
function spark(vals,{w=120,h=40}={}){
  const id=gid(),max=Math.max(...vals),min=Math.min(...vals),n=vals.length;
  const pts=vals.map((v,i)=>[(i/(n-1))*(w-6)+3,h-4-((v-min)/((max-min)||1))*(h-10)]);
  const d=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const last=pts[n-1];
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" aria-hidden="true"><defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#19a972" stop-opacity=".28"/><stop offset="1" stop-color="#19a972" stop-opacity="0"/></linearGradient></defs><path d="${d} L${last[0].toFixed(1)} ${h} L3 ${h} Z" fill="url(#${id})"/><path d="${d}" fill="none" stroke="#19a972" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="${last[0].toFixed(1)}" cy="${last[1].toFixed(1)}" r="3.6" fill="#fff" stroke="#0d8356" stroke-width="2.2"/></svg>`;
}

function badge(i,size=56){

  const spark4='<path d="M35.5 10.5l1 2.5 2.5 1-2.5 1-1 2.5-1-2.5-2.5-1 2.5-1z" fill="#fff"/>';

function simCalc(){
  const s=+S.sim.s,t=+S.sim.t,a=+S.sim.a,sal=+S.sim.sal,c=sal*0.5,N=s+t+a;
  let sumS=0,sumT=0; for(let k=1;k<=Math.max(N,1);k++){const b=TIERS[tierOf(k)];sumS+=b.s;sumT+=b.t;}
  const n=Math.max(N,1),avgS=sumS/n,avgT=sumT/n;
  const eS=Math.round(s*c*avgS/100),eT=Math.round(t*c*avgT/100),eA=a*ABROAD_FEE,tot=eS+eT+eA,ti=tierOf(N);
  const bands=TIERS.map((b,i)=>i<4?Math.max(0,Math.min(10,N-10*i)):Math.max(0,N-40));
  return {s,t,a,sal,c,N,avgS,avgT,eS,eT,eA,tot,ti,bands};
}

       <label class="field"><span>Minimum tier</span><select id="dbf-tier" data-bind="dbf.tier" data-live="db">${opts(['GO','PLUS','PRO'],f.tier,'Any')}</select></label>
       <label class="check" style="align-self:end;padding-bottom:10px"><input type="checkbox" id="dbf-ver" data-bind="dbf.ver" data-live="db" ${f.ver?'checked':''}> <span>Fully verified only</span></label>
     </div>
     <div id="db-results">${dbResults()}</div>
   </div>
   <div class="panel-h" style="margin:0"><h3>Newest requests</h3><button class="btn btn-quiet btn-sm" data-act="tab" data-arg="requests">All ${ic('arrow','sm')}</button></div>${reqTable(OREQ.slice(0,3))}
   <div class="sec-row" id="fees-collect"><div><span class="eyebrow">Fees to collect</span><h3 style="margin-top:8px">Commission due from running tuitions</h3><p class="muted" style="font-size:.86rem">${tk(outstanding)} outstanding · ${overdue} overdue · start date shown for each tuition</p></div></div>
   ${feesTable(true,false)}`;
}

/* ---------- prototype map ---------- */
function mapSheet(){
  const g=(title,items)=>`<div class="map-group"><span class="eyebrow">${title}</span>${items.map(([v,l,s,act])=>`<button ${act?`data-act="${act}" data-arg="${v}"`:`data-go="${v}"`}><span>${l}</span><small>${s}</small></button>`).join('')}</div>`;
  return `<div class="sheet-bg" data-act="map-bg"><div class="sheet" role="dialog" aria-label="Prototype map">
    <div class="row between"><h3>Prototype map</h3><button class="icon-btn" data-act="map" aria-label="Close">${ic('close')}</button></div>
    <p class="muted" style="font-size:.9rem">Jump to any public page or open the Universal Dashboard with all 3 options.</p>
    ${g('Public website',[['home','Home','Hero, audiences, how it works'],['tutors','Find a tutor','Filters, tutor cards'],['jobs','Tuition jobs','Vacancy board, apply'],['teach','Become a tutor','Requirements, tiers'],['partner','Partner program','Calculator, rules'],['abroad','Study abroad','Destinations, booking'],['talks','Hub Talks','Articles'],['about','About & contact','Hotline, form']])}
    ${g('Flows',[['request','Request a tutor','4-step form'],['login','Universal log in / sign up','Single phone + OTP login (no role split)']])}
    ${g('Universal Dashboard (1 Account · 3 Options)',[['hub','All 3 Options Hub','Choose between Guardian, Tutor & Partner','demo'],['guardian','Option 1 · Student & Guardian','Requests, shortlist, trial','demo'],['tutor','Option 2 · Tutor','Matches, applications, documents','demo'],['partner','Option 3 · Partner','Referrals, payouts & progression','demo']])}
  </div></div>`;
}

/* ---------- render & routing ---------- */
const app=document.getElementById('app');
function render(){
  let html='',isDash=false;
  if(DASH_VIEWS[S.view]){
    const mode=DASH_VIEWS[S.view];
    S.loggedIn=true;
    if(S.view!=='dash') S.dashMode=mode;
    const activeMode=S.dashMode||'hub';
    isDash=true;
    const viewFn={hub:dHub,guardian:dGuardian,tutor:dTutor,partner:dPartner}[activeMode]||dHub;
    html=shell(activeMode,viewFn());
  }else{
    const V={home:vHome,tutors:vTutors,'tutor-profile':vTutorProfile,jobs:vJobs,request:vRequest,teach:vTeach,partner:vPartner,abroad:vAbroad,talks:vTalks,article:vArticle,about:vAbout,login:vLogin}[S.view]||vHome;
    html=header()+`<main>${V()}</main>`+(S.view==='login'?'':footer());
  }
  html+=`<button class="fab" data-act="map">${ic('map','sm')}Pages</button>`;
  if(S.map) html+=mapSheet();
  html+=modalView();
  app.innerHTML=html;
  document.body.classList.toggle('in-dash',isDash);
}
function go(v,{keepTab}={}){
  if(DASH_VIEWS[v]&&v!=='dash'){S.dashMode=DASH_VIEWS[v];v='dash';}
  S.view=v; S.menu=false; S.map=false;
  if(!keepTab) S.dashTab='overview';
  if(v!=='login') S.flash='';
  const token=v==='tutor-profile'?'tutors':v==='article'?'talks':v;
  try{history.replaceState(null,'','#'+token)}catch(e){}
  render(); window.scrollTo({top:0,behavior:'instant'});
}
let toastT;
function toast(msg){
  document.querySelectorAll('.toast').forEach(t=>t.remove());
  const t=document.createElement('div');t.className='toast';t.setAttribute('role','status');t.innerHTML=`${ic('check','sm')}<span>${esc(msg)}</span>`;document.body.appendChild(t);
  clearTimeout(toastT);toastT=setTimeout(()=>t.remove(),3200);
}
function setPath(path,val){const k=path.split('.');let o=S;for(let i=0;i<k.length-1;i++)o=o[k[i]];o[k[k.length-1]]=val;}
function demoLogin(mode='hub'){S.loggedIn=true;S.dashMode=mode||'hub';S.dashTab='overview';go('dash',{keepTab:true});}

document.addEventListener('click',e=>{
  const goEl=e.target.closest('[data-go]');
  if(goEl){e.preventDefault();go(goEl.dataset.go);return;}
  const a=e.target.closest('[data-act]');
  if(!a) return;
  const act=a.dataset.act,arg=a.dataset.arg;
  if((act==='menu-bg'||act==='map-bg'||act==='modal-bg')&&e.target!==a) return;
  switch(act){
    case 'menu': case 'menu-bg': S.menu=!S.menu; render(); break;
    case 'map': case 'map-bg': S.map=!S.map; render(); break;
    case 'finder-mode': S.finderMode=arg; render(); break;
    case 'finder-go':
      if(S.finderMode==='tutor'){S.tf={area:S.finder.area,level:S.finder.level,tier:'',q:S.finder.subject};go('tutors');}
      else{S.jf={area:S.finder.area,level:S.finder.level,mode:'',q:S.finder.subject};go('jobs');}
      break;
    case 'profile': S.profileId=arg; go('tutor-profile'); break;
    case 'article': S.articleId=arg; go('article'); break;
    case 'save': S.saved.has(arg)?S.saved.delete(arg):S.saved.add(arg); render(); toast(S.saved.has(arg)?'Saved to your shortlist.':'Removed.'); break;
    case 'request-tutor': {const t=TUTORS.find(x=>x.id===arg); S.req.d.tutor=t.name; S.req.d.subjects=[t.subj[0]]; S.req.step=0; S.req.done=false; go('request'); break;}
    case 'apply':
      if(!S.loggedIn){S.login={mode:'login',step:0,phone:'',name:'',next:{act:'apply',arg}};S.flash=`Log in to your account to apply for ${arg}. You’ll come straight back to it.`;go('login');}
      else{S.applied.add(arg);render();toast(`Applied to ${arg}. Track it under Option 2 (Tutor) → Applications.`);}
      break;
    case 'req-next': S.req.step=Math.min(REQ_STEPS.length-1,S.req.step+1); render(); window.scrollTo(0,0); break;
    case 'req-back': S.req.step=Math.max(0,S.req.step-1); render(); break;
    case 'req-subj': {const s=S.req.d.subjects,i=s.indexOf(arg); i>-1?s.splice(i,1):s.push(arg); render(); break;}
    case 'req-mode': S.req.d.mode=arg; render(); break;
    case 'req-reset': S.req.step=0; S.req.done=false; S.req.d.tutor=''; render(); break;
    case 'signup':
      if(S.loggedIn){demoLogin(arg||'hub');}
      else{S.login={mode:'signup',step:0,phone:'',name:'',next:arg?{act:'mode',arg}:null};go('login');}
      break;
    case 'login-mode': S.login.mode=arg; render(); break;
    case 'login-back': S.login.step=0; render(); break;
    case 'demo': {const next=S.login.next; S.login.next=null; demoLogin(arg||'hub'); if(next&&next.act==='apply'){S.applied.add(next.arg);S.dashMode='tutor';S.dashTab='applications';render();toast(`Applied to ${next.arg}.`);} break;}
    case 'dash-mode': S.loggedIn=true; S.dashMode=arg||'hub'; S.dashTab='overview'; go('dash',{keepTab:true}); break;
    case 'dash-jump': {const [m,t]=(arg||'hub:overview').split(':'); S.loggedIn=true; S.dashMode=m||'hub'; S.dashTab=t||'overview'; go('dash',{keepTab:true}); break;}
    case 'dash-profile': S.loggedIn=true; S.dashMode='hub'; S.dashTab='profile'; go('dash',{keepTab:true}); break;
    case 'tab': S.dashTab=arg; render(); window.scrollTo(0,0); break;
    case 'switch': S.map=true; render(); break;
    case 'logout': S.loggedIn=false; S.dashMode='hub'; go('home'); toast('Logged out.'); break;
    case 'toast': toast(arg); break;
    case 'g-trial': S.shortlist[arg]='trial'; render(); toast('Trial request sent. Your coordinator will confirm a time.'); break;
    case 'g-decline': S.shortlist[arg]='no'; render(); break;
    case 'rate': a.parentElement.querySelectorAll('.icon-btn').forEach((b,i)=>{b.style.color=i<Number(arg)?'var(--hi)':'';b.querySelector('svg').style.fill=i<Number(arg)?'var(--hi)':'none';}); break;
    case 'copy': navigator.clipboard?.writeText(arg).then(()=>toast('Code copied.')).catch(()=>toast('Copy not allowed here. Code: '+arg)); if(!navigator.clipboard) toast('Code: '+arg); break;
    case 'ref-again': S.refSubmitted=false; render(); break;
    case 'avail': S.avail.has(arg)?S.avail.delete(arg):S.avail.add(arg); a.setAttribute('aria-pressed',S.avail.has(arg)); break;
    case 'toggle-press': a.setAttribute('aria-pressed',a.getAttribute('aria-pressed')!=='true'); break;
    case 'ops-assign': S.opsAssigned.add(arg); render(); toast(`${arg} assigned to you.`); break;
    case 'ops-short': S.opsShort.add(arg); render(); break;
    case 'ops-reject': S.opsReject.add(arg); render(); break;
    case 'calc-type': S.calc.type=arg; render(); break;
    case 'fee-recv': S.feeCollected.add(arg); render(); toast(`Fee for ${arg} marked as received.`); break;
    case 'release': S.released.add(arg); render(); toast(`${arg}: tutor’s share released by bKash (prototype).`); break;
    case 'ref-type': S.refType=arg; S.refDone=''; render(); break;
    case 'ref-for': S.refType='tutor'; S.refVac=arg; S.refDone=''; render(); setTimeout(()=>document.getElementById('ref-form')?.scrollIntoView({behavior:'smooth',block:'start'}),30); toast(`Referring a tutor for ${arg}.`); break;
    case 'share-vac': {const j=JOBS.find(x=>x.code===arg); const txt=`${j.code} · ${j.title} · ${j.cls} · ${j.area} · ${tk(j.sal)}/month. Apply at tutorshub.net/jobs (code ${S.user.code})`; navigator.clipboard?.writeText(txt).then(()=>toast('Vacancy details copied to share.')).catch(()=>toast('Copy not allowed here.')); if(!navigator.clipboard) toast('Copy not allowed here.'); break;}
    case 'modal': S.modal={type:arg}; render(); break;
    case 'modal-bg': case 'modal-close': S.modal=null; render(); break;
    case 'disburse-ok': S.disbursed=true; S.modal=null; render(); toast('Disbursement requested: ৳3,750 to bKash within 7 working days.'); break;
    case 'vacancy': S.modal={type:'vacancy',code:arg}; render(); break;
    case 'kpi-more': if(arg.startsWith('#')){document.getElementById(arg.slice(1))?.scrollIntoView({behavior:'smooth',block:'start'});} else {S.dashTab=arg.split(':')[1]; render(); window.scrollTo(0,0);} break;
    case 'db-all': S.dbAll=!S.dbAll; document.getElementById('db-results').innerHTML=dbResults(); break;
    case 'db-reset': S.dbf={area:'',level:'',subj:'',g:'',mode:'',tier:'',ver:false}; S.dbAll=false; render(); break;
    case 'db-send': {const t=TUTOR_DB.find(x=>x.id===arg),v=document.getElementById('dbv-'+arg)?.value; toast(`${t.name} sent for ${v}. Added to the vacancy’s tutors (prototype).`); break;}
    case 'pay-approve': S.payApproved.add(arg); render(); toast(`${arg} approved for bKash payout.`); break;
    case 'abroad-book': S.abroadCountry=arg; if(S.view!=='abroad'){go('abroad');} else render(); setTimeout(()=>document.getElementById('abroad-form')?.scrollIntoView({behavior:'smooth'}),50); break;
  }
});
document.addEventListener('input',e=>{
  const el=e.target; if(!el.dataset.bind) return;
  setPath(el.dataset.bind,el.type==='checkbox'?el.checked:el.value);
  const live=el.dataset.live;
  if(live==='tutors') document.getElementById('tutor-results').innerHTML=tutorResults();
  if(live==='jobs') document.getElementById('job-results').innerHTML=jobResults();
  if(live==='calc') document.getElementById('calc-out').innerHTML=calcOut();
  if(live==='fee') document.getElementById('fee-out').innerHTML=feeOut();
  if(live==='sim'){const k=el.dataset.bind.split('.')[1],mn=+el.dataset.min,mx=+el.dataset.max;el.style.setProperty('--p',((+el.value-mn)/(mx-mn)*100).toFixed(1)+'%');const lab=document.querySelector(`[data-val="${k}"]`);if(lab)lab.textContent=k==='sal'?tk(el.value):el.value;document.getElementById('sim-out').innerHTML=simOut();}
  if(live==='db'){S.dbAll=false;document.getElementById('db-results').innerHTML=dbResults();}
});
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.dataset.act==='upload'&&el.files?.length){toast(`${el.files[0].name} uploaded for review (prototype; nothing leaves your phone).`);}
  if(el.dataset.bind&&!el.dataset.live&&S.view==='request'&&el.tagName==='SELECT') render();
});
document.addEventListener('submit',e=>{
  e.preventDefault();
  const id=e.target.id;
  if(id==='req-form'&&S.req.step<REQ_STEPS.length-1){S.req.step++;render();window.scrollTo(0,0);}
  else if(id==='req-form'){S.req.done=true;S.req.id='R-'+(1052+Math.floor(Math.random()*40));render();window.scrollTo(0,0);}
  else if(id==='login-form'){
    if(S.login.step===0){S.login.step=1;render();}
    else{
      if(S.login.name&&S.login.name.trim()) S.user.name=S.login.name.trim();
      if(S.login.phone&&S.login.phone.trim()) S.user.phone=S.login.phone.trim();
      const next=S.login.next;S.login.next=null;S.login.step=0;
      if(next&&next.act==='apply'){demoLogin('tutor');S.applied.add(next.arg);S.dashTab='applications';render();toast(`Applied to ${next.arg}.`);}
      else if(next&&next.act==='mode'){demoLogin(next.arg);}
      else{demoLogin('hub');}
    }
  }
  else if(id==='prof-form'){
    const nm=document.getElementById('pf-name')?.value?.trim(),ph=document.getElementById('pf-phone')?.value?.trim(),ar=document.getElementById('pf-area')?.value;
    if(nm) S.user.name=nm;
    if(ph) S.user.phone=ph;
    if(ar) S.user.area=ar;
    render(); toast('Account details saved.');
  }
  else if(id==='ref-form'){
    const g=x=>document.getElementById(x)?.value||'';const ty=S.refType;
    const n={student:`Guardian · ${g('rf-area')} · ${g('rf-cls')||g('rf-level')}`,tutor:`Tutor · ${g('rf-inst')||g('rf-subj')||'new tutor'}${g('rf-vac')?' · for '+g('rf-vac'):''}`,abroad:`Study abroad · ${g('rf-country')} · ${g('rf-goal')}`}[ty];
    REFS.unshift({n,type:ty,d:'Today',st:'Submitted',k:'mute',e:'—'}); PSTAT[ty].sub++; S.refDone=n; S.refVac=''; render(); toast('Referral submitted. A coordinator will call them.');}
  else if(id==='abroad-form'){toast('Session request received. An adviser will call you (prototype).');e.target.reset();}
  else if(id==='contact-form'){toast('Message received (prototype).');e.target.reset();}
  else toast('Saved.');
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&(S.map||S.menu||S.modal)){S.map=false;S.menu=false;S.modal=null;render();}});

/* boot */
(function(){
  let h='';try{h=(location.hash||'').slice(1)}catch(e){}
  if(DASH_VIEWS[h]) {S.loggedIn=true;S.dashMode=DASH_VIEWS[h];S.view='dash';}
  else if(PUBLIC.includes(h)) S.view=h;
  render();
})();
</script>
